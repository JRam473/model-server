services:
  - type: web
    name: modelo-server
    env: python
    plan: free
    buildCommand: |
      echo "🚀 Instalando dependencias optimizadas..."
      pip install -r requirements.txt
    startCommand: |
      echo "🎯 Iniciando servidor optimizado..."
      python modelo_server.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: TRANSFORMERS_OFFLINE
        value: "0"
    healthCheckPath: /health
    autoDeploy: true